# The ChiropteraOS package repository.
#
# Append this to /etc/pacman.conf, *below* [core] and [extra], so that an
# official package always wins a name collision with one of ours.
#
# Set Server to the published repository URL. That host has not been chosen
# yet; see docs/repository.md.

[chiroptera]
SigLevel = Never
Server = https://REPLACE-ME/chiroptera/$arch

# Once CI signs packages, drop SigLevel = Never above, import the ChiropteraOS
# packaging key into pacman's keyring, and use this instead:
#
# SigLevel = Required DatabaseOptional
