# Administrator settings for the login screen, seeded into
# /var/lib/noctalia-greeter/greeter.toml on first install only. Appearance is
# left to sync.toml so the shell's Sync can change it.

# ChiropteraOS, not Hyprland: that session starts Hyprland without
# chiroptera-session, which puts the real GPUs ahead of DisplayLink's evdi
# cards in AQ_DRM_DEVICES. See boot/session/chiroptera-session.
[session]
default = "ChiropteraOS"
