# pacman.conf for building the image, not the one inside it
# (that is airootfs/etc/pacman.conf).

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# The ChiropteraOS packages: CI's chiroptera-repo artifact plus
# chiroptera-calamares-config. Unsigned until the publish job signs them.
# ci/build-iso.sh fills /build/repo.
[chiroptera]
SigLevel = Optional TrustAll
Server = file:///build/repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Last on purpose: only what Arch lacks (the installer, the greeter) comes
# from here. The live image stays plain x86-64 Arch; chiroptera-hwd moves the
# installed system to CachyOS.
[cachyos]
Server = https://cdn77.cachyos.org/repo/$arch/$repo

# Calamares only. CachyOS's cachyos-calamares is linked against Boost 1.91,
# which Arch and CachyOS have both replaced with 1.92, so it cannot start;
# BlackArch's build does not use Boost.
[blackarch]
Server = https://mirrors.dotsrc.org/blackarch/$repo/os/$arch
