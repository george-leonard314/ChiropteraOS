LABEL arch
TEXT HELP
Boot the ChiropteraOS live on BIOS.
It allows you to install ChiropteraOS or perform system maintenance.
ENDTEXT
MENU LABEL ChiropteraOS live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the ChiropteraOS live on BIOS with speakup screen reader.
It allows you to install ChiropteraOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL ChiropteraOS live (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n accessibility=on
