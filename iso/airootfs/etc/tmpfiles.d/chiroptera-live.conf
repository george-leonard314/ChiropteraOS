# Live session home; chiroptera-live-cleanup deletes this file on the target.
C /home/live - - - - /etc/skel
# A passwordless, unencrypted keyring, so gnome-keyring never asks the live
# user to invent a password.
C /home/live/.local/share/keyrings - - - - /etc/chiroptera-live/keyrings
# Replaces the empty overrides file from /etc/skel: opens the installer.
L+ /home/live/.config/hypr/hyprland/user.conf - - - - /etc/chiroptera-live/user.conf
Z /home/live - live live -
z /home/live 0700 live live -
Z /home/live/.local/share/keyrings 0700 live live -
