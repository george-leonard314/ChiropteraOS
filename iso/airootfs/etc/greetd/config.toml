# Live session: log straight into Hyprland as the live user. After logout,
# or on the installed system, the Noctalia greeter takes over.
[terminal]
vt = 1

[default_session]
command = "env NOCTALIA_GREETER_ASSETS_DIR=/usr/share/chiroptera/greeter/assets /usr/bin/noctalia-greeter-session"
user = "greeter"

[initial_session]
# Not start-hyprland directly: the wrapper works out which DRM devices to
# render on and keeps DisplayLink's evdi cards out of that list, which would
# otherwise leave every output black on a machine with a dock attached at boot.
# See the comment in the script itself.
command = "/usr/local/bin/chiroptera-live-session"
user = "live"
