# Live session only. chiroptera-dots ships hyprland/user.conf as an empty
# file for personal overrides; tmpfiles points the live user's copy here, so
# the installer opens by itself once the desktop is up. The target never sees
# this: chiroptera-live-cleanup deletes /etc/chiroptera-live, and the live
# user is removed during the install.
exec-once = sleep 4 && chiroptera-install

# Calamares asks for a fixed window and neither shrinks nor scrolls to its
# Back/Next/Install row. Forcing a smaller size only clips that row off, so
# give it the whole screen instead: the layout then always has room.
windowrule = fullscreen true, match:class calamares
