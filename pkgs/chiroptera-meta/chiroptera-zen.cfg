// Chiroptera: follow the wallpaper palette live (the first line must be a comment).
//
// Chiroptera Shell's zen-browser template renders the palette into
// ~/.cache/noctalia/zen-browser/zen-userChrome.css and @imports it from each
// profile's userChrome.css and userContent.css. Gecko reads those only at
// startup, so on its own a new wallpaper reaches Zen after a restart.
//
// Every rule in that file takes its colors from the custom properties declared
// at its top (--base, --primary, ...). This script watches the file and, when
// it changes, registers those declarations again as !important user-sheet
// rules for chrome and about: documents. They win over the copy loaded at
// startup, so every rule picks up the new colors without a restart. Web pages
// are left alone.
(function () {
  const { classes: Cc, interfaces: Ci } = Components;
  const Services = globalThis.Services
    || ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;
  const env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);
  const cacheHome = env.get("XDG_CACHE_HOME") || env.get("HOME") + "/.cache";
  const path = env.get("CHIROPTERA_ZEN_PALETTE")
    || cacheHome + "/noctalia/zen-browser/zen-userChrome.css";
  const debug = env.exists("CHIROPTERA_ZEN_DEBUG");
  const log = msg => { if (debug) dump("chiroptera-zen: " + msg + "\n"); };

  const sss = Cc["@mozilla.org/content/style-sheet-service;1"]
    .getService(Ci.nsIStyleSheetService);
  let sheetURI = null;
  let lastModified = 0;
  let lastBlock = null;
  let timer = null; // kept referenced so the repeating timer is not collected

  function logComputed() {
    if (!debug) return;
    const win = Services.wm.getMostRecentWindow("navigator:browser");
    if (!win) return log("no browser window");
    const style = win.getComputedStyle(win.document.documentElement);
    log("computed --primary=" + style.getPropertyValue("--primary").trim()
      + " --zen-primary-color=" + style.getPropertyValue("--zen-primary-color").trim());
  }

  function readFile(file) {
    const stream = Cc["@mozilla.org/network/file-input-stream;1"]
      .createInstance(Ci.nsIFileInputStream);
    stream.init(file, -1, 0, 0);
    const conv = Cc["@mozilla.org/intl/converter-input-stream;1"]
      .createInstance(Ci.nsIConverterInputStream);
    conv.init(stream, "UTF-8", 0, 0);
    let text = "";
    const chunk = {};
    while (conv.readString(0xffff, chunk)) text += chunk.value;
    conv.close();
    return text;
  }

  // The @media (prefers-color-scheme) blocks before the first :root rule,
  // with every declaration made !important.
  function paletteBlock(css) {
    const end = css.search(/^:root\s*\{/m);
    if (end < 0 || !css.slice(0, end).includes("prefers-color-scheme: light")) return null;
    return css.slice(0, end).replace(/(--[\w-]+\s*:\s*[^;{}!]+?)\s*;/g, "$1 !important;");
  }

  function check() {
    try {
      const file = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      file.initWithPath(path);
      if (!file.exists() || file.lastModifiedTime === lastModified) return;
      const modified = file.lastModifiedTime;
      const block = paletteBlock(readFile(file));
      if (!block) return; // half-written; the next tick reads it again
      lastModified = modified;
      if (block === lastBlock) return;
      const first = lastBlock === null;
      lastBlock = block;
      // The startup @import already carries the current palette.
      if (first) return logComputed();
      const css = '@-moz-document url-prefix("chrome:"), url-prefix("about:") {\n'
        + block + "}\n";
      const uri = Services.io.newURI("data:text/css;charset=utf-8," + encodeURIComponent(css));
      sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
      if (sheetURI && sss.sheetRegistered(sheetURI, sss.USER_SHEET)) {
        sss.unregisterSheet(sheetURI, sss.USER_SHEET);
      }
      sheetURI = uri;
      log("palette reloaded from " + path);
      logComputed();
    } catch (e) {
      log("reload failed: " + e);
    }
  }

  Services.obs.addObserver(function observer() {
    Services.obs.removeObserver(observer, "final-ui-startup");
    check();
    timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
    timer.initWithCallback({ notify: check }, 1000, Ci.nsITimer.TYPE_REPEATING_SLACK);
    log("watching " + path);
  }, "final-ui-startup");
})();
