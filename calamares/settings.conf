# ChiropteraOS installer: an offline install that copies the live image to
# disk, turns it into a normal system, then runs chiroptera-hwd to move it to
# CachyOS. Modules we configure are instances with a chiroptera-*.conf file so
# they never collide with the configs cachyos-calamares ships in
# /etc/calamares/modules; everything else uses those configs as they are.
---
# The second path holds our own job modules (chiroptera-netcheck).
modules-search: [ local, /usr/share/chiroptera/calamares/modules ]

instances:
- { id: chiroptera, module: welcome,          config: chiroptera-welcome.conf }
- { id: chiroptera, module: locale,           config: chiroptera-locale.conf }
- { id: chiroptera, module: partition,        config: chiroptera-partition.conf }
- { id: chiroptera, module: users,            config: chiroptera-users.conf }
- { id: chiroptera, module: unpackfs,         config: chiroptera-unpackfs.conf }
- { id: chiroptera, module: removeuser,       config: chiroptera-removeuser.conf }
- { id: chiroptera, module: services-systemd, config: chiroptera-services-systemd.conf }
- { id: chiroptera, module: bootloader,       config: chiroptera-bootloader.conf }
- { id: chiroptera, module: grubcfg,          config: chiroptera-grubcfg.conf }
- { id: chiroptera, module: finished,         config: chiroptera-finished.conf }
- { id: chiroptera, module: preservefiles,    config: chiroptera-preservefiles.conf }
- { id: chiroptera, module: chiroptera-netcheck, config: chiroptera-netcheck.conf }
- { id: blackarch,  module: shellprocess,     config: chiroptera-shellprocess-blackarch.conf }
- { id: apps,       module: netinstall,       config: chiroptera-netinstall.conf }
- { id: browser,    module: packagechooser,   config: chiroptera-packagechooser-browser.conf }
- { id: apps,       module: packages,         config: chiroptera-packages.conf }
- { id: cleanup,    module: shellprocess,     config: chiroptera-shellprocess-cleanup.conf }
- { id: dns,        module: shellprocess,     config: chiroptera-shellprocess-dns.conf }
- { id: resolv,     module: shellprocess,     config: chiroptera-shellprocess-resolv.conf }
- { id: hwd,        module: shellprocess,     config: chiroptera-shellprocess-hwd.conf }

sequence:
- show:
  - welcome@chiroptera
  - locale@chiroptera
  - keyboard
  - partition@chiroptera
  - users@chiroptera
  - netinstall@apps
  - packagechooser@browser
  - summary
- exec:
  - partition@chiroptera
  - mount
  - unpackfs@chiroptera
  - machineid
  - fstab
  - locale@chiroptera
  - keyboard
  - localecfg
  - shellprocess@cleanup
  - luksbootkeyfile
  - luksopenswaphookcfg
  - initcpiocfg
  - initcpio
  - removeuser@chiroptera
  - users@chiroptera
  - networkcfg
  - hwclock
  - services-systemd@chiroptera
  - grubcfg@chiroptera
  - bootloader@chiroptera
  - chiroptera-netcheck@chiroptera
  - shellprocess@dns
  - shellprocess@hwd
  - shellprocess@blackarch
  - packages@apps
  - shellprocess@resolv
  - preservefiles@chiroptera
  - umount
- show:
  - finished@chiroptera

branding: chiroptera
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
