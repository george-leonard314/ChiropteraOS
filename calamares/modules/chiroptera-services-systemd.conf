---
units:
    - { name: "NetworkManager",    action: "enable",  mandatory: false }
    - { name: "systemd-resolved",  action: "enable",  mandatory: false }
    - { name: "greetd",            action: "enable",  mandatory: false }
    - { name: "bluetooth",         action: "enable",  mandatory: false }
    - { name: "systemd-timesyncd", action: "enable",  mandatory: false }
    - { name: "fstrim.timer",      action: "enable",  mandatory: false }
    - { name: "pacman-init",       action: "disable", mandatory: false }
