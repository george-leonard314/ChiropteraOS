# /etc/default/grub on the target. Not CachyOS's grubcfg.conf: that one points
# GRUB_TOP_LEVEL at linux-cachyos, which only exists after chiroptera-hwd
# runs (hwd sets GRUB_TOP_LEVEL itself), and at a theme we do not ship.
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "loglevel=3" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_THEME: "/usr/share/grub/themes/darkmatter/theme.txt"
    GRUB_GFXMODE: "auto"
    GRUB_DISABLE_SUBMENU: false
    GRUB_DISABLE_OS_PROBER: false
    GRUB_DISABLE_RECOVERY: true
always_use_defaults: true
