# GRUB on both UEFI and BIOS (chiroptera-hwd's GRUB path is the one proven on
# real hardware), so the ESP sits at /boot/efi and LUKS is version 1: GRUB
# has to unlock /boot, and it cannot open LUKS2's default argon2 keyslots.
---
efiSystemPartition:     "/boot/efi"
efiSystemPartitionSize: 1024M
efiSystemPartitionName: EFI
userSwapChoices:  [ none, file ]
initialSwapChoice: none
luksGeneration: luks1
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
defaultPartitionTableType: gpt
defaultFileSystemType:    "ext4"
availableFileSystemTypes: [ "ext4", "btrfs" ]
