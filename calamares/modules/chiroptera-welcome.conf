---
showSupportUrl:      false
showKnownIssuesUrl:  false
showReleaseNotesUrl: false
showDonateUrl:       false
requirements:
    requiredStorage: 20
    requiredRam:     2.0
    internetCheckUrl: https://archlinux.org
    # Internet is checked but not required: without it the install still
    # finishes, only chiroptera-hwd (CachyOS) is skipped.
    check:    [ storage, ram, power, internet, root, screen ]
    required: [ storage, ram, root ]
geoip:
    style:    "xml"
    url:      "https://geoip.kde.org/v1/ubiquity"
    selector: "CountryCode"
