# Keep the installer's log on the installed system. Every online step
# (chiroptera-hwd, BlackArch, the extra apps) is allowed to fail without
# stopping the install, so this log is the only record of why one did.
# Runs after the last of them, just before umount.
---
files:
    - from: log
      dest: /var/log/chiroptera-installer.log
      perm: root:root:0600
