# Moves the installed system to CachyOS: repositories, kernel, microcode,
# graphics drivers, boot entry. Needs the internet. A failure is ignored (the
# leading "-") so the install still finishes on stock Arch; run
# `sudo chiroptera-hwd apply` after first boot to retry.
---
i18n:
    name: "Hardware detection and CachyOS (chiroptera-hwd)"
dontChroot: false
timeout: 7200
# Twice: every step is idempotent, and the first run can lose a package to a
# CachyOS mirror that is briefly out of sync (a 404 or a stalled transfer
# aborts the whole upgrade). The second run picks up where it stopped.
script:
    - command: "-/usr/bin/chiroptera-hwd apply --yes"
      timeout: 7200
    - command: "-/usr/bin/chiroptera-hwd apply --yes"
      timeout: 7200
