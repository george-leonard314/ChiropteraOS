# The target's /etc/resolv.conf points into /run, which Calamares mounts as an
# empty tmpfs inside the chroot. Give chiroptera-hwd the live system's
# resolver; shellprocess@resolv puts the link back once the last online
# step (the extra apps) is done.
---
dontChroot: true
timeout: 30
script:
    - "-cp -L --remove-destination /etc/resolv.conf ${ROOT}/etc/resolv.conf"
