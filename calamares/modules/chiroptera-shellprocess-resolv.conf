# Puts the target's /etc/resolv.conf back to systemd-resolved's stub, after
# every step that needs the internet. shellprocess@dns replaced it with the
# live system's resolver: the stub lives under /run, which Calamares mounts
# as an empty tmpfs in the chroot, so pointing at it any earlier leaves the
# BlackArch and extra-apps steps without DNS.
---
i18n:
    name: "Restoring the network configuration"
dontChroot: false
timeout: 30
script:
    - "-ln -sf ../run/systemd/resolve/stub-resolv.conf /etc/resolv.conf"
