# Creates the new account's Documents, Pictures, Downloads and the other XDG
# user folders, right after users@chiroptera. A failure is ignored (the
# leading "-"): xdg-user-dirs.service would still create them at first login.
---
i18n:
    name: "Creating the home folders"
dontChroot: false
timeout: 60
script:
    - command: "-/etc/calamares/scripts/chiroptera-user-dirs ${USER}"
