# Adds the BlackArch repository, after chiroptera-hwd has set up CachyOS and
# before the extra apps are installed. Needs the internet; a failure is
# ignored (the leading "-"), and `sudo chiroptera-blackarch` retries later.
---
i18n:
    name: "Adding the BlackArch repository"
dontChroot: false
timeout: 900
script:
    - command: "-/usr/bin/chiroptera-blackarch"
      timeout: 900
