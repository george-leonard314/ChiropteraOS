# Installs whatever the "Extra apps" page selected. Runs after
# chiroptera-hwd, which is what puts the CachyOS repositories on the target.
# Without the internet the step is skipped, not failed.
---
backend: pacman
skip_if_no_internet: true
update_db: true
update_system: false
pacman:
    num_retries: 2
    disable_download_timeout: true
    needed_only: true
