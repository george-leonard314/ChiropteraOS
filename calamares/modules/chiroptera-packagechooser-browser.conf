# The installer's "Browser" page: exactly one of Firefox, Zen Browser and
# Brave, Firefox preselected. packages@apps installs the choice together with
# the "Extra apps", after chiroptera-hwd has added the CachyOS repositories
# zen-browser-bin and brave-bin come from. Without the internet that step is
# skipped, and so is the browser.
#
# Win+W runs chiroptera-browser from chiroptera-dots, which opens whichever of
# the three is installed.
---
mode: required
method: packages
labels:
    step: "Browser"
default: firefox
# Icons from papirus-icon-theme, which the image carries through chiroptera-meta.
items:
    - id: firefox
      packages: [ firefox ]
      name: "Firefox"
      description: "Mozilla's browser, from the Arch repositories."
      screenshot: "/usr/share/icons/Papirus/64x64/apps/firefox.svg"
    - id: zen-browser
      packages: [ zen-browser-bin ]
      name: "Zen Browser"
      description: "A Firefox-based browser with vertical tabs and a minimal interface, from the CachyOS repositories."
      screenshot: "/usr/share/icons/Papirus/64x64/apps/zen-browser.svg"
    - id: brave
      packages: [ brave-bin ]
      name: "Brave"
      description: "A Chromium-based browser that blocks ads and trackers by default, from the CachyOS repositories."
      screenshot: "/usr/share/icons/Papirus/64x64/apps/brave.svg"
