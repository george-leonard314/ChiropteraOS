# archiso keeps the kernel outside the squashfs, on the ISO itself; copy it
# next to the system so initcpio and GRUB find it. There are no separate
# microcode images: mkinitcpio's microcode hook embeds them in the initramfs
# from /usr/lib/firmware, which the squashfs does carry.
---
unpack:
    -   source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux"
        sourcefs: "file"
        destination: "/boot/vmlinuz-linux"
