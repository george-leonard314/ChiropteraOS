# The installer's "Extra apps" page. Ticked by default: these are the apps
# George wants on a fresh machine that are too big for the image itself.
# They come from the CachyOS repositories, which is why the packages job runs
# after chiroptera-hwd. AUR-only apps (SiYuan) cannot be installed from here;
# `chiroptera-apps` handles those after first boot.
- name: "Apps"
  description: "Brave, VSCodium, OnlyOffice, GIMP and Obsidian, plus paru so the AUR works. About 3 GB; needs the internet."
  selected: true
  hidden: false
  critical: false
  expanded: true
  packages:
    - base-devel
    - paru
    - brave-bin
    - vscodium
    - onlyoffice-bin
    - gimp
    - obsidian
