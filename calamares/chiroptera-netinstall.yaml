# The installer's "Extra apps" page: one group, the repository half of
# chiroptera-dots' packages/apps.txt. Keep the two in step when that list
# changes. AUR apps (and the BlackArch list) cannot be installed from here;
# `chiroptera-apps` handles those after first boot.
#
# The packages job runs after chiroptera-hwd, so the CachyOS repositories
# these come from already exist on the target.
- name: "George's apps"
  description: "Everything on the ChiropteraOS app list that comes from a repository: browsers, office, media, development and virtualisation. Needs the internet, and adds a few gigabytes to the install."
